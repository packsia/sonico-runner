<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sonico Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 1000px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      background: transparent;
      display: block;
    }
    #message {
      font-family: sans-serif;
      font-size: 16px;
      color: #a22;
      margin-bottom: 8px;
      text-align: center;
    }
    #mobile-btn {
      display: none;
      font-size: 18px;
      padding: 8px 16px;
      background: #a22;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      #message { display: none; }
      #mobile-btn { display: block; }
    }
  </style>
</head>
<body>
  
<div id="stage">
  <canvas id="game"></canvas>

  <!-- HUD overlay (sits on top of the canvas only) -->
  <div id="hud">
    <div id="message">Press Space to Start</div>

    <div id="gameOver" class="hidden">
      <img id="gameOverImg" src="assets/sonico-images/gameover.png" alt="Game Over">
      <img id="restartBtn"  src="assets/sonico-images/restart.png"  alt="Restart" tabindex="0">
    </div>
  </div>
</div>


  <button id="mobile-btn">Start</button>

  <script src="index.js"></script>
</body>
</html>
